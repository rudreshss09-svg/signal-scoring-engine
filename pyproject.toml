[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-scoring-engine"
version = "0.1.0"
description = "Deterministic, explainable account scoring from timestamped buying signals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rudresh Shendge" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.18"]

[project.scripts]
signal-score = "signal_scoring_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
